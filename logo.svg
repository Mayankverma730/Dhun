<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="dhun-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="45%" stop-color="#ec4899" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="dhun-wave" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <filter id="dhun-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="3.5" flood-color="#a855f7" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background container optional/transparent -->
  <rect width="100" height="100" rx="22" fill="#0d081f" />
  
  <!-- Radiating Left Sound Arcs -->
  <path d="M 28 36 A 20 20 0 0 0 28 64" fill="none" stroke="#d946ef" stroke-width="3" stroke-linecap="round" opacity="0.85" filter="url(#dhun-glow)" />
  <path d="M 22 28 A 30 30 0 0 0 22 72" fill="none" stroke="#a855f7" stroke-width="3.5" stroke-linecap="round" opacity="0.65" filter="url(#dhun-glow)" />

  <!-- Iconic Futuristic Stylized 'D' Shape -->
  <path d="M 36 25 L 52 25 C 68 25 76 36 76 50 C 76 64 68 75 52 75 L 36 75 Z" 
        fill="none" 
        stroke="url(#dhun-grad)" 
        stroke-width="7" 
        stroke-linejoin="round"
        stroke-linecap="round"
        filter="url(#dhun-glow)" />
  
  <path d="M 44 38 L 50 38 C 58 38 62 43 62 50 C 62 57 58 62 50 62 L 44 62 Z" 
        fill="url(#dhun-grad)" 
        opacity="0.25" />

  <!-- Pulse / Audio Waveform Cutting Through -->
  <path d="M 58 50 L 65 50 L 69 41 L 73 59 L 77 44 L 81 55 L 85 48 L 90 50" 
        fill="none" 
        stroke="url(#dhun-wave)" 
        stroke-width="3.2" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#dhun-glow)" />
</svg>
