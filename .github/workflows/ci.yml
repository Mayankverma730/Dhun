name: Dhun CI Build & Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Compile DSA test suite
        run: |
          gcc -Wall -Wextra -std=c99 -o test_dsa test_dsa.c song.c library.c stack.c queue.c bst.c heap.c hash.c sort.c playlist.c avl.c trie.c graph.c cache.c logger.c -lm
          chmod +x test_dsa

      - name: Run DSA test suite
        run: |
          OUT=$(./test_dsa 2>&1) || true
          # Replace newlines with %0A for GitHub annotation format
          ESCAPED="${OUT//$'\n'/'%0A'}"
          echo "::error title=DSA_OUTPUT::$ESCAPED"
          ./test_dsa

      - name: Compile and run performance benchmarks
        run: |
          gcc -Wall -Wextra -std=c99 -o benchmark benchmark.c song.c library.c stack.c queue.c bst.c heap.c hash.c sort.c playlist.c avl.c trie.c graph.c cache.c logger.c -lm
          chmod +x benchmark
          ./benchmark

      - name: Compile CLI binary
        run: |
          gcc -Wall -Wextra -std=c99 -o music_mgr main.c song.c library.c stack.c queue.c bst.c heap.c hash.c sort.c playlist.c avl.c trie.c graph.c cache.c logger.c -lm
          chmod +x music_mgr
